name: Testes Verilog

on:
  push:
  pull_request:

jobs:
  testar-portas:
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Instalar Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Executar testbenches AND, OR, NOT, NAND e NOR
        run: make test
